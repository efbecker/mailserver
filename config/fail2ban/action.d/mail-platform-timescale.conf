# =============================================================================
# Mail Platform :: action Fail2ban -> hypertable security_events (TimescaleDB)
# Executa /usr/local/sbin/mp-security-event (Python + psycopg2, conexão TLS
# verify-full com a role mailplatform_telemetry, que só tem INSERT).
# Se o Servidor 2 estiver indisponível o evento vai para um spool local e é
# reenviado no próximo evento — o banimento em si nunca é bloqueado.
# =============================================================================
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/sbin/mp-security-event --service fail2ban --jail "<jail>" --ip "<ip>" --action BAN --details "failures=<failures> bantime=<bantime>"
actionunban = /usr/local/sbin/mp-security-event --service fail2ban --jail "<jail>" --ip "<ip>" --action UNBAN --details "unban"

[Init]
jail = default
timeout = 20
