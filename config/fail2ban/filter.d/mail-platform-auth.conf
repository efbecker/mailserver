# =============================================================================
# Mail Platform :: filtro de falhas de autenticação do Webmail/Painel Admin
# Formato da linha (escrito pelo backend PHP em /var/log/mail-platform/auth.log):
#   2026-11-11T11:40:00+00:00 webmail AUTH_FAIL ip=203.0.113.7 user="a@b.com"
#   2026-11-11T11:40:00+00:00 admin AUTH_FAIL ip=2001:db8::7 user="admin"
# =============================================================================
[Definition]
failregex = ^\s*(?:webmail|admin) AUTH_FAIL ip=<HOST>(?:\s|$)
ignoreregex =
datepattern = {^LN-BEG}
