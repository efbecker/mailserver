# Mail Platform :: cabeçalhos consumidos pelo mail-ingest.py
# (spf_pass / dkim_pass / dmarc_pass / spam_score na hypertable messages)
use = ["authentication-results", "x-spamd-result", "x-spam-status", "x-spam-level", "x-rspamd-queue-id"];
authenticated_headers = ["authentication-results"];
skip_local = false;
skip_authenticated = true;
extended_spam_headers = true;
routines {
  authentication-results {
    header = "Authentication-Results";
    remove = 1;          # remove Authentication-Results forjados pelo remetente
    add_smtp_user = false;
  }
  x-spamd-result {
    header = "X-Spamd-Result";
    remove = 1;
  }
  x-spam-status {
    header = "X-Spam-Status";
    remove = 1;
  }
}
