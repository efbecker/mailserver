; =============================================================================
; Mail Platform :: pool PHP-FPM dedicado (gerado por deploy-mail-node.sh)
; =============================================================================
[mail-platform]
user = mailplatform
group = mailplatform
listen = {{FPM_SOCKET}}
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 32
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
request_terminate_timeout = 900s
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php

clear_env = yes
env[MP_CONFIG_FILE] = /etc/mail-platform/app.env
env[MP_APP_DIR] = {{APP_DIR}}
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

php_admin_value[open_basedir] = {{APP_DIR}}:/etc/mail-platform:/var/lib/mail-platform:/var/log/mail-platform:/tmp
php_admin_value[upload_tmp_dir] = /var/lib/mail-platform/tmp
php_admin_value[sys_temp_dir] = /var/lib/mail-platform/tmp
php_admin_value[session.save_path] = /var/lib/mail-platform/sessions
php_admin_value[error_log] = /var/log/mail-platform/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,pcntl_exec,dl
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.use_strict_mode] = 1
php_admin_value[session.use_only_cookies] = 1
php_admin_value[session.sid_length] = 48
php_admin_value[session.sid_bits_per_character] = 6
php_admin_value[session.gc_maxlifetime] = 3600
php_admin_value[session.name] = MPSESSID
