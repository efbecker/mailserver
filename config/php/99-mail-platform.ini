; Mail Platform :: ajustes globais do PHP 8.4 (FPM e CLI)
expose_php = Off
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
upload_max_filesize = 50M
post_max_size = 60M
max_file_uploads = 20
default_charset = "UTF-8"
date.timezone = UTC
zend.exception_ignore_args = On
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
