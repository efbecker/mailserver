# =============================================================================
# Mail Platform :: /etc/opendkim.conf (gerado por deploy-mail-node.sh)
# OpenDKIM apenas ASSINA (Mode s). A verificação DKIM/SPF/DMARC de entrada é
# feita pelo Rspamd, que grava o resultado em Authentication-Results.
# As chaves são instaladas pelo painel admin via /usr/local/sbin/mp-dkim-ctl.
# =============================================================================
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes
UMask                   007
UserID                  opendkim:opendkim
PidFile                 /run/opendkim/opendkim.pid
Socket                  inet:8891@127.0.0.1

Mode                    s
Canonicalization        relaxed/simple
SignatureAlgorithm      rsa-sha256
SubDomains              no
OversignHeaders         From,Subject,Date,To,Cc,Reply-To,Message-ID
AlwaysAddARHeader       no
RequireSafeKeys         yes
MinimumKeyBits          1024

# Tabelas: KeyTable (arquivo simples) + SigningTable (expressões regulares)
KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
ExternalIgnoreList      /etc/opendkim/TrustedHosts
InternalHosts           /etc/opendkim/TrustedHosts
