name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in install.sh bin/*.sh bin/helpers/mp-f2b-ctl bin/helpers/mp-dkim-ctl bin/helpers/mp-tls-deploy-hook; do
            bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck -e SC2015 install.sh bin/*.sh bin/helpers/mp-f2b-ctl bin/helpers/mp-dkim-ctl bin/helpers/mp-tls-deploy-hook
      - name: python compile
        run: python3 -m py_compile bin/helpers/mp-security-event
