# =============================================================================
# Mail Platform :: VirtualHost Apache2 hardened (Debian 13 / Apache 2.4)
# -----------------------------------------------------------------------------
# Instalado por bin/deploy-mail-node.sh em
#   /etc/apache2/sites-available/mail-platform.conf
#
# As variáveis ${MP_*} são definidas (Define) em
#   /etc/apache2/conf-available/mail-platform-vars.conf
# gerado pelo deploy. Requer: mpm_event, ssl, headers, rewrite, proxy,
# proxy_fcgi, setenvif, http2. O PHP 8.4 roda via PHP-FPM (pool dedicado).
# =============================================================================

# Backend PHP-FPM (pool "mail-platform"). flushpackets=on é necessário para o
# streaming SSE dos logs de deploy SSH chegar em tempo real ao navegador.
<Proxy "fcgi://mail-platform-fpm/" enablereuse=on flushpackets=on timeout=900>
</Proxy>

# -----------------------------------------------------------------------------
# HTTP :80 -> apenas ACME (Let's Encrypt) e redirecionamento permanente p/ HTTPS
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName ${MP_SERVER_NAME}
    ServerSignature Off

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        ForceType text/plain
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://${MP_SERVER_NAME}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/mail-platform-error.log
    CustomLog ${APACHE_LOG_DIR}/mail-platform-access.log combined
</VirtualHost>

# -----------------------------------------------------------------------------
# HTTPS :443 -> Painel Admin + Webmail
# -----------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName ${MP_SERVER_NAME}
    DocumentRoot ${MP_APP_DIR}/public
    ServerSignature Off
    Protocols h2 http/1.1

    # ---- TLS 1.3 estrito ---------------------------------------------------
    SSLEngine on
    SSLCertificateFile ${MP_TLS_CERT}
    SSLCertificateKeyFile ${MP_TLS_KEY}
    SSLProtocol -all +TLSv1.3
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    SSLOpenSSLConfCmd Curves X25519:prime256v1:secp384r1
    SSLHonorCipherOrder off
    SSLCompression off
    SSLSessionTickets off

    # ---- Limites ------------------------------------------------------------
    # 60 MiB: mensagens de até 50 MiB com anexos (base64 + overhead JSON).
    LimitRequestBody 62914560
    LimitRequestFields 64
    LimitRequestLine 8190
    TraceEnable off
    ProxyTimeout 900

    # ---- Cabeçalhos de segurança --------------------------------------------
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always unset X-Powered-By
    Header unset X-Powered-By

    # CSP global da aplicação: somente recursos próprios, nenhum script inline,
    # nenhum script/fonte/estilo externo. A rota /api/webmail/render/ é a única
    # exceção: ela serve o HTML de um e-mail dentro do <iframe sandbox> e envia
    # uma CSP própria e ainda mais restritiva (default-src 'none'; imagens
    # externas só após o clique em "Carregar imagens externas").
    # THE_REQUEST (linha original) e não REQUEST_URI: o FallbackResource faz um
    # redirect interno para /index.php, que mudaria o REQUEST_URI.
    <If "%{THE_REQUEST} !~ m#^[A-Z]+ /api/webmail/render/#">
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'self'; child-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
        Header always set X-Frame-Options "DENY"
    </If>
    <Else>
        Header always set X-Frame-Options "SAMEORIGIN"
    </Else>

    # ---- Aplicação ----------------------------------------------------------
    <Directory "${MP_APP_DIR}/public">
        Options -Indexes -Includes -ExecCGI +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        # Front-controller: tudo que não for arquivo estático vai p/ index.php
        FallbackResource /index.php
        # Repassa o header Authorization ao PHP (tokens de API/CSRF).
        CGIPassAuth On
    </Directory>

    # Nada fora de public/ é servido (src/, bin/, sql/, .git ficam inacessíveis
    # porque o DocumentRoot é public/). Defesa extra contra arquivos sensíveis:
    <Directory "${MP_APP_DIR}">
        Require all denied
    </Directory>
    <FilesMatch "(^\.|\.(?:env|ini|conf|sql|sh|py|bak|swp|log|dist|lock)$|~$)">
        Require all denied
    </FilesMatch>

    RewriteEngine On
    # Bloqueia métodos fora do necessário pela API/SPA.
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$
    RewriteRule ^ - [R=405,L]
    # Bloqueia qualquer caminho com segmento oculto (/.git, /.env, ...).
    RewriteRule "(^|/)\." - [F,L]

    # PHP via FPM (somente o front-controller e scripts dentro de public/)
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:${MP_FPM_SOCKET}|fcgi://mail-platform-fpm/"
    </FilesMatch>

    # ---- Painel Admin: restrito por IP (lista gerada pelo deploy) -----------
    <LocationMatch "^/(admin\.html|api/admin(/|$)|assets/js/admin\.js)">
        Include /etc/apache2/mail-platform/admin-allow.conf
    </LocationMatch>

    # ---- API: sem cache ------------------------------------------------------
    # (THE_REQUEST: ver nota acima sobre o redirect interno do FallbackResource)
    <If "%{THE_REQUEST} =~ m#^[A-Z]+ /api/#">
        Header always set Cache-Control "no-store, max-age=0"
        Header always set Pragma "no-cache"
    </If>

    # ---- Server-Sent Events (logs SSH em tempo real) -------------------------
    # Sem compressão nem buffering, para cada linha chegar imediatamente.
    <If "%{THE_REQUEST} =~ m#^[A-Z]+ /api/admin/\S*/stream(\?\S*)? #">
        SetEnv no-gzip 1
        SetEnv dont-vary 1
        Header always set Cache-Control "no-cache, no-transform"
        Header always set X-Accel-Buffering "no"
    </If>

    # ---- Assets estáticos: cache longo ---------------------------------------
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=604800, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/mail-platform-error.log
    CustomLog ${APACHE_LOG_DIR}/mail-platform-access.log combined
</VirtualHost>
